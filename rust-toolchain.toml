# To use the standard library,
# we use the `build-std` feature in `.cargo/config.toml`,
# which automatically compiles `std` from the source for your specific chip.
# This feature is currently unstable and requires the `nightly` toolchain.
[toolchain]
channel = "nightly-2026-04-08"
components = ["rust-src", "rustfmt", "clippy"]
